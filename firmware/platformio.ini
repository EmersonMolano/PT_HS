[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0
  h2zero/NimBLE-Arduino@^2.0.0
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -I provisioning

[env:esp32dev-flespi]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DHIDROSMART_MQTT_USE_TLS=1
